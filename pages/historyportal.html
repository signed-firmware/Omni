<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Portal | Neo Shredder Group WIKI</title>
    <meta name="description" content="Chronology and portal links for NSG shredder history.">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="wiki-body wiki-body--nightsky">

    <div id="wiki-nav"></div>

    <main class="wiki-container history-portal-page">

        <header class="history-portal-welcome">
            <p class="history-portal-eyebrow">Portal</p>
            <h1 class="wiki-page-title">History Portal</h1>
            <p class="wiki-lead history-portal-lead">
                The history of shredders and related things, categorised under the main leader at the time. <span class="mini-note--text">there were no leaders during proto shredders, only exilir8 making shredders</span>
            </p>
        </header>

        <nav class="wiki-breadcrumb" aria-label="Breadcrumb">
            <a href="/index.html">Main Page</a>
            <span>History Portal</span>
        </nav>

        <div class="history-portal-layout">
            <div class="history-portal-main">

                <section class="wiki-block history-chrono" id="chronology" aria-labelledby="chrono-heading">
                    <div class="wiki-block-body history-chrono-body">

                        <h2 class="history-chrono-heading" id="chrono-heading">Chronology</h2>

                        <div class="history-chrono-unit">
                            <div class="history-era-pill" role="tablist" aria-label="Era I categories">
                                <button type="button" role="tab" class="history-era-tab history-era-name--1 is-active"
                                    id="chrono-tab-proto" data-chrono-key="proto" aria-selected="true"
                                    aria-controls="history-chrono-events">Proto-Shredders</button>
                                <span class="history-chrono-dot" aria-hidden="true">•</span>
                                <button type="button" role="tab" class="history-era-tab history-era-name--2"
                                    id="chrono-tab-jannu" data-chrono-key="jannu07" aria-selected="false"
                                    aria-controls="history-chrono-events">Jannu07</button>
                                <span class="history-chrono-dot" aria-hidden="true">•</span>
                                <button type="button" role="tab" class="history-era-tab history-era-name--3"
                                    id="chrono-tab-duckless" data-chrono-key="duckless" aria-selected="false"
                                    aria-controls="history-chrono-events">Duckless</button>
                                <span class="history-chrono-dot" aria-hidden="true">•</span>
                                <button type="button" role="tab" class="history-era-tab history-era-name--4"
                                    id="chrono-tab-glitch" data-chrono-key="glitch" aria-selected="false"
                                    aria-controls="history-chrono-events">Glitch</button>
                                <span class="history-chrono-dot" aria-hidden="true">•</span>
                                <button type="button" role="tab" class="history-era-tab history-era-name--5"
                                    id="chrono-tab-xhunter" data-chrono-key="xhunter" aria-selected="false"
                                    aria-controls="history-chrono-events">Xhunter</button>
                                <span class="history-chrono-dot" aria-hidden="true">•</span>
                                <button type="button" role="tab" class="history-era-tab history-era-name--6"
                                    id="chrono-tab-kameon" data-chrono-key="kameon" aria-selected="false"
                                    aria-controls="history-chrono-events">Kameon</button>
                            </div>
                            <p class="history-event-chain" id="history-chrono-events" role="tabpanel"
                                aria-labelledby="chrono-tab-proto"></p>
                        </div>

                    </div>
                </section>
    </main>

    <footer id="wiki-footer"></footer>
    <script src="../js/skidunited.js"></script>
    <script>
        (function () {
            const CHRONO_EVENTS = {
                proto: [
                    { label: 'Missiles', href: '#' },
                    { label: 'Early Mouse Aim', href: '#' },
                    { label: 'Pre Meta Builds', href: '#' },
                    { label: 'Gen 1 "Shredder Bugs"', href: '#' }
                ],
                jannu07: [
                    { label: 'Omni Bug Laboratories', href: '#' },
                    { label: 'Gen 2 Shredders', href: '#' },
                    { label: 'Warpers', href: '#' },
                    { label: 'ANOs', href: '#' }
                ],
                duckless: [
                    { label: 'CSA', href: '#' },
                    { label: 'Warp League', href: '#' },
                    { label: 'Gen 3-4 Shredders', href: '#' },
                    { label: 'Destruction of AST', href: '#' }
                ],
                glitch: [
                    { label: 'SFC', href: '#' },
                    { label: 'Gen 5-6 Shredders', href: '#' },
                    { label: 'NSE/SR', href: '#' }
                ],
                xhunter: [
                    { label: 'SC', href: '#' },
                    { label: 'Gen 7 Shredders', href: '#' },
                ],
                kameon: [
                    { label: 'NSG/SR', href: '#' },
                    { label: 'Destruction of SC', href: '#' },
                    { label: 'Gen 8-9 Shredders', href: '#' }
                ]
            };

            function renderChronoChain(key) {
                const panel = document.getElementById('history-chrono-events');
                const tabs = document.querySelectorAll('.history-era-tab');
                if (!panel) return;

                const items = CHRONO_EVENTS[key] || [];
                panel.innerHTML = items.map(function (item, index) {
                    const link = '<a href="' + item.href + '">' + item.label + '</a>';
                    if (index === 0) return link;
                    return '<span class="history-chrono-dot" aria-hidden="true">•</span>' + link;
                }).join('');

                tabs.forEach(function (tab) {
                    const active = tab.dataset.chronoKey === key;
                    tab.classList.toggle('is-active', active);
                    tab.setAttribute('aria-selected', active ? 'true' : 'false');
                    if (active) {
                        panel.setAttribute('aria-labelledby', tab.id);
                    }
                });
            }

            function initHistoryChrono() {
                const tabs = document.querySelectorAll('.history-era-tab');
                if (!tabs.length) return;

                tabs.forEach(function (tab) {
                    tab.addEventListener('click', function () {
                        renderChronoChain(tab.dataset.chronoKey);
                    });
                });

                renderChronoChain('proto');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHistoryChrono);
            } else {
                initHistoryChrono();
            }
        })();
    </script>

</body>

</html>
